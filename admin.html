<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সুরক্ষিত অ্যাডমিন প্যানেল - PSSUS</title>
    <style>
        body { font-family: 'NikoshFont', Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
        .admin-box { max-width: 500px; margin: 30px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { color: #1a5276; text-align: center; border-bottom: 2px solid #e67e22; padding-bottom: 10px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
        .btn { width: 100%; padding: 12px; background-color: #1a5276; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; transition: 0.3s; margin-top: 10px; }
        .btn:hover { background-color: #154360; }
        .token-area { background: #fff3e0; padding: 15px; border-radius: 8px; border: 1px dashed #e67e22; margin-bottom: 20px; }
        #admin-content { display: none; }
        .status { margin-top: 15px; text-align: center; font-weight: bold; }
        .warning { font-size: 12px; color: #666; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="admin-box">
        <div id="login-form">
            <h2>অ্যাডমিন প্রবেশ</h2>
            <div class="input-group">
                <label>ইউজার আইডি:</label>
                <input type="text" id="user-id" placeholder="ID দিন">
            </div>
            <div class="input-group">
                <label>পাসওয়ার্ড:</label>
                <input type="password" id="user-pass" placeholder="Password দিন">
            </div>
            <button class="btn" onclick="login()">লগইন করুন</button>
            <p id="login-error" style="color: red; display: none; text-align: center;">ভুল আইডি বা পাসওয়ার্ড!</p>
        </div>

        <div id="admin-content">
            <h2>ড্যাশবোর্ড</h2>
            
            <div class="token-area">
                <label style="color: #e67e22;">গিটহাব টোকেন (Security Key):</label>
                <input type="password" id="gh-token" placeholder="আপনার PAT পেস্ট করুন">
                <p class="warning">*এই টোকেনটি কোথাও সেভ হবে না, তাই প্রতিবার ব্যবহারের সময় দিতে হবে।</p>
            </div>

            <div class="input-group">
                <label>কি আপডেট করতে চান?</label>
                <select id="data-type">
                    <option value="members">সদস্য তালিকা</option>
                    <option value="accounts">আয়-ব্যয়</option>
                </select>
            </div>

            <div class="input-group">
                <label>তথ্য (JSON ফরম্যাটে):</label>
                <textarea id="data-input" rows="5" placeholder='{"name": "রহিম", "role": "সদস্য"}'></textarea>
            </div>

            <button class="btn" onclick="updateData()">গিটহাবে সেভ করুন</button>
            <div id="status-msg" class="status"></div>
        </div>
    </div>

    <script>
        // লগইন চেক (প্রাথমিক সুরক্ষা)
        function login() {
            const id = document.getElementById('user-id').value;
            const pass = document.getElementById('user-pass').value;

            // আইডি ও পাসওয়ার্ড আপনার মতো করে পরিবর্তন করে নিন
            if(id === "admin123" && pass === "club789") {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        // গিটহাব এপিআই ফাংশন
        async function updateData() {
            const token = document.getElementById('gh-token').value;
            const content = document.getElementById('data-input').value;
            const status = document.getElementById('status-msg');

            if(!token) {
                alert("দয়া করে গিটহাব টোকেনটি দিন!");
                return;
            }

            status.style.color = "blue";
            status.innerText = "গিটহাবে তথ্য পাঠানো হচ্ছে...";

            // এখানে আপনার রিপোজিটরির নাম দিন (username/repo-name)
            const repo = "YOUR_USERNAME/YOUR_REPO_NAME"; 
            const path = "data.json";

            try {
                // ফাইলটির বর্তমান অবস্থা (SHA) জানা প্রয়োজন
                const res = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`);
                const fileData = await res.json();
                const sha = fileData.sha;

                // নতুন ডাটা আপডেট করা
                const updateRes = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: "Data updated via Admin Panel",
                        content: btoa(unescape(encodeURIComponent(content))), // ডাটা এনকোড করা
                        sha: sha
                    })
                });

                if(updateRes.ok) {
                    status.style.color = "green";
                    status.innerText = "সফলভাবে সেভ হয়েছে!";
                } else {
                    throw new Error("আপডেট ব্যর্থ হয়েছে।");
                }
            } catch (err) {
                status.style.color = "red";
                status.innerText = "ত্রুটি: " + err.message;
            }
        }
    </script>
</body>
</html>
        <div id="admin-content">
            <h2>ড্যাশবোর্ড</h2>
            
            <div style="background: #e3f2fd; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                <p>স্বাগতম, অ্যাডমিন! এখান থেকে আপনি তথ্য পরিবর্তন করতে পারবেন।</p>
            </div>

            <div class="input-group">
                <label>বিভাগ সিলেক্ট করুন:</label>
                <select id="data-type">
                    <option value="member">নতুন সদস্য যোগ</option>
                    <option value="account">আয়/ব্যয় আপডেট</option>
                </select>
            </div>

            <div class="input-group">
                <label>বিস্তারিত তথ্য (JSON format):</label>
                <input type="text" id="data-input" placeholder="তথ্য এখানে লিখুন">
            </div>

            <button class="btn" onclick="updateGitHub()">গিটহাবে আপডেট করুন</button>
            <div id="status-msg" class="status"></div>
        </div>
    </div>

    <script>
        // লগইন ফাংশন
        function login() {
            const id = document.getElementById('user-id').value;
            const pass = document.getElementById('user-pass').value;

            // আপনার পছন্দের আইডি এবং পাসওয়ার্ড এখানে দিন
            if(id === "admin123" && pass === "club789") {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        // গিটহাব এপিআই দিয়ে ফাইল আপডেট করার ফাংশন (সংক্ষিপ্ত রূপ)
        async function updateGitHub() {
            const msg = document.getElementById('status-msg');
            msg.style.color = "blue";
            msg.innerText = "প্রসেসিং হচ্ছে...";

            // এখানে আপনার গিটহাব টোকেন এবং এপিআই কোড বসবে পরবর্তীতে
            setTimeout(() => {
                msg.style.color = "green";
                msg.innerText = "সফলভাবে আপডেট হয়েছে! (ডেমো)";
            }, 2000);
        }
    </script>
</body>
</html>
