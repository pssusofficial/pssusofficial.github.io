<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>PSSUS Admin - Pro Panel</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; padding: 15px; }
        .container { max-width: 650px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h2, h3 { color: #1a5276; text-align: center; margin-bottom: 15px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
        .btn { background: #1a5276; color: white; border: none; padding: 12px; cursor: pointer; border-radius: 8px; font-weight: bold; width: 100%; transition: 0.3s; }
        .btn-red { background: #c0392b; }
        .btn-green { background: #27ae60; }
        .btn:active { transform: scale(0.98); }
        #dashboard { display: none; }
        .input-group { background: #f9f9f9; padding: 15px; border-radius: 10px; border: 1px solid #eee; margin-bottom: 20px; }
        
        .member-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        .member-table th, .member-table td { padding: 10px; border-bottom: 1px solid #eee; text-align: left; }
        .action-btns { display: flex; gap: 5px; }
        #status { text-align: center; font-weight: bold; margin: 10px 0; min-height: 20px; }
        .search-box { border: 2px solid #1a5276; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-section">
        <h2>অ্যাডমিন প্রবেশ</h2>
        <input type="text" id="user-id" placeholder="ইউজার আইডি">
        <input type="password" id="user-pass" placeholder="পাসওয়ার্ড">
        <input type="password" id="login-token" placeholder="GitHub Token">
        <button class="btn" onclick="checkLogin()">লগইন করুন</button>
    </div>

    <div id="dashboard">
        <h2>কন্ট্রোল প্যানেল</h2>
        
        <div class="input-group">
            <h3 id="form-title">সদস্য যোগ করুন</h3>
            <input type="hidden" id="m-id">
            
            <label>কমিটি সেকশন:</label>
            <select id="m-section">
                <option value="core">Core Committee</option>
                <option value="advisory">Advisory Committee</option>
                <option value="general">General Member</option>
            </select>

            <input type="text" id="m-name" placeholder="সদস্যের নাম">
            <input type="text" id="m-role" placeholder="পদবী">
            <input type="text" id="m-phone" placeholder="মোবাইল নম্বর">
            <input type="text" id="m-img" placeholder="ছবির লিঙ্ক" value="https://via.placeholder.com/100">
            
            <button class="btn btn-green" id="save-btn" onclick="saveMember()">সেভ করুন</button>
            <button class="btn" id="cancel-btn" style="margin-top:5px; display:none; background:#7f8c8d;" onclick="resetForm()">বাতিল</button>
        </div>

        <p id="status"></p>

        <h3>সদস্য তালিকা</h3>
        <input type="text" id="search-input" class="search-box" placeholder="খুঁজুন (নাম বা পদবী)..." onkeyup="filterMembers()">
        
        <table class="member-table">
            <thead>
                <tr>
                    <th>নাম</th>
                    <th>সেকশন</th>
                    <th>অ্যাকশন</th>
                </tr>
            </thead>
            <tbody id="member-list-body"></tbody>
        </table>

        <button class="btn btn-red" onclick="logout()" style="margin-top:25px;">লগ আউট</button>
    </div>
</div>

<script>
    const repo = "pssusofficial/pssusofficial.github.io";
    const path = "data.json";
    let sessionToken = "";
    let allMembers = [];

    function checkLogin() {
        const id = document.getElementById('user-id').value.trim();
        const pass = document.getElementById('user-pass').value.trim();
        const token = document.getElementById('login-token').value.trim();

        if(id === "admin123" && pass === "club789" && token) {
            sessionToken = token;
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            loadMembers();
        } else { alert("সবগুলো তথ্য সঠিকভাবে দিন!"); }
    }

    async function loadMembers() {
        try {
            const res = await fetch(`https://api.github.com/repos/${repo}/contents/${path}?t=${new Date().getTime()}`);
            const fileData = await res.json();
            const content = JSON.parse(decodeURIComponent(escape(atob(fileData.content))));
            allMembers = content.members || [];
            renderTable(allMembers);
        } catch (err) { console.error("Load failed", err); }
    }

    function renderTable(data) {
        const tbody = document.getElementById('member-list-body');
        if(!tbody) return;
        tbody.innerHTML = '';
        data.forEach(m => {
            tbody.innerHTML += `
                <tr>
                    <td>${m.name}<br><small>${m.role}</small></td>
                    <td>${m.section || 'general'}</td>
                    <td class="action-btns">
                        <button class="btn btn-green" style="padding:5px" onclick="editMember(${m.id})">Edit</button>
                        <button class="btn btn-red" style="padding:5px" onclick="deleteMember(${m.id})">Del</button>
                    </td>
                </tr>
            `;
        });
    }

    function filterMembers() {
        const term = document.getElementById('search-input').value.toLowerCase();
        const filtered = allMembers.filter(m => 
            m.name.toLowerCase().includes(term) || 
            (m.role && m.role.toLowerCase().includes(term))
        );
        renderTable(filtered);
    }

    async function saveMember() {
        const id = document.getElementById('m-id').value;
        const section = document.getElementById('m-section').value;
        const name = document.getElementById('m-name').value.trim();
        const role = document.getElementById('m-role').value.trim();
        const phone = document.getElementById('m-phone').value.trim();
        const img = document.getElementById('m-img').value.trim();
        const status = document.getElementById('status');

        if(!name || !role) return alert("নাম ও পদবী দিন");
        status.style.color = "blue";
        status.innerText = "গিটহাবে সেভ হচ্ছে...";

        try {
            const res = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
                headers: { 'Authorization': `token ${sessionToken}` }
            });
            const fileData = await res.json();
            let content = JSON.parse(decodeURIComponent(escape(atob(fileData.content))));
            if(!content.members) content.members = [];

            if (id) {
                const index = content.members.findIndex(m => m.id == id);
                if(index !== -1) {
                    content.members[index] = { id: parseInt(id), section, name, role, phone, image: img };
                }
            } else {
                content.members.push({ id: Date.now(), section, name, role, phone, image: img });
            }

            const updateRes = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${sessionToken}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: `Updated ${name}`,
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(content, null, 2)))),
                    sha: fileData.sha
                })
            });

            if(updateRes.ok) {
                status.style.color = "green";
                status.innerText = "সফলভাবে সেভ হয়েছে!";
                resetForm();
                loadMembers();
            } else { throw new Error("Update failed"); }
        } catch (err) { 
            status.style.color = "red";
            status.innerText = "ত্রুটি: " + err.message; 
        }
    }

    async function deleteMember(id) {
        if(!confirm("ডিলিট করতে চান?")) return;
        try {
            const res = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
                headers: { 'Authorization': `token ${sessionToken}` }
            });
            const fileData = await res.json();
            let content = JSON.parse(decodeURIComponent(escape(atob(fileData.content))));
            content.members = content.members.filter(m => m.id != id);
            
            const updateRes = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${sessionToken}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: "Deleted member",
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(content, null, 2)))),
                    sha: fileData.sha
                })
            });
            if(updateRes.ok) loadMembers();
        } catch (err) { alert("ডিলিট করা যায়নি!"); }
    }

    function editMember(id) {
        const m = allMembers.find(m => m.id == id);
        if(!m) return;
        document.getElementById('m-id').value = m.id;
        document.getElementById('m-section').value = m.section || 'general';
        document.getElementById('m-name').value = m.name;
        document.getElementById('m-role').value = m.role;
        document.getElementById('m-phone').value = m.phone;
        document.getElementById('m-img').value = m.image;
        
        document.getElementById('form-title').innerText = "তথ্য পরিবর্তন করুন";
        document.getElementById('save-btn').innerText = "আপডেট করুন";
        document.getElementById('cancel-btn').style.display = "block";
        window.scrollTo(0, 0);
    }

    function resetForm() {
        document.getElementById('m-id').value = '';
        document.getElementById('m-name').value = '';
        document.getElementById('m-role').value = '';
        document.getElementById('m-phone').value = '';
        document.getElementById('m-img').value = 'https://via.placeholder.com/100';
        document.getElementById('form-title').innerText = "সদস্য যোগ করুন";
        document.getElementById('save-btn').innerText = "সেভ করুন";
        document.getElementById('cancel-btn').style.display = "none";
    }

    function logout() { location.reload(); }
</script>

</body>
</html>
