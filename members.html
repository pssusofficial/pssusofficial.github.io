<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>সদস্য তালিকা - PSSUS</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; text-align: center; }
        .member-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; }
        .member-card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 200px; }
        .member-card img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; }
        .member-card h3 { margin: 10px 0 5px; color: #1a5276; font-size: 18px; }
        .member-card p { margin: 0; color: #666; font-size: 14px; }
        .loading { margin-top: 50px; font-size: 20px; color: #666; }
    </style>
</head>
<body>

    <h1>আমাদের সদস্যবৃন্দ</h1>
     <div class="container">
      <h2>Core Committee</h2>
       <div id="core-list" class="member-container"></div>

      <h2>Advisory Committee</h2>
       <div id="advisory-list" class="member-container"></div>

      <h2>General Members</h2>
       <div id="general-list" class="member-container"></div>
    </div>

 <script>
    async function loadMembers() {
        const response = await fetch('https://raw.githubusercontent.com/pssusofficial/pssusofficial.github.io/main/data.json?t=' + new Date().getTime());
        const data = await response.json();
        
        const sections = {
            core: document.getElementById('core-list'),
            advisory: document.getElementById('advisory-list'),
            general: document.getElementById('general-list')
        };

        // আগের তথ্য মুছে ফেলা
        Object.values(sections).forEach(s => s.innerHTML = '');

        data.members.forEach(member => {
            const card = `
                <div class="member-card">
                    <img src="${member.image}">
                    <h3>${member.name}</h3>
                    <p>${member.role}</p>
                    <p>${member.phone}</p>
                </div>`;
            
            // যার যে সেকশন সেখানে কার্ডটি পাঠিয়ে দেওয়া
            if(sections[member.section]) {
                sections[member.section].innerHTML += card;
            } else {
                sections.general.innerHTML += card; // ডিফোল্ট জেনারেল
            }
        });
    }
    window.onload = loadMembers;
 </script>

</body>
</html>
